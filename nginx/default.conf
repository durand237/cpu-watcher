server {
    listen 80;
    listen [::]:80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Replace this directory with the built frontend assets when they exist.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/v1/metrics/processes/stream {
        set $backend cpu-watcher:8080;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nginx reaches the backend through cpu-watcher-private; the backend has
    # no externally published Docker port.
    location /api/ {
        set $backend cpu-watcher:8080;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
