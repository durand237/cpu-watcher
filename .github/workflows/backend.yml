name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "compose.yaml"
      - "nginx/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    tags: ["backend-v*"]
    paths:
      - "backend/**"
      - "compose.yaml"
      - "nginx/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Derive build version
        id: version
        shell: bash
        run: |
          version="0.0.1-SNAPSHOT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#backend-v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid backend release tag: $GITHUB_REF_NAME"; exit 1; }
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Make Gradle wrapper executable
        working-directory: backend
        run: chmod +x gradlew
      - name: Test
        working-directory: backend
        run: ./gradlew -PreleaseVersion="${{ steps.version.outputs.value }}" test --no-daemon
      - name: Build application JAR
        working-directory: backend
        run: ./gradlew -PreleaseVersion="${{ steps.version.outputs.value }}" bootJar --no-daemon
      - name: Verify Docker image build
        run: docker build --build-arg APP_VERSION="${{ steps.version.outputs.value }}" --tag cpu-watcher:${{ github.sha }} backend

  publish-ecr:
    name: Publish immutable backend image
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/tags/backend-v') &&
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.AWS_DEFAULT_REGION != '' &&
      vars.AWS_ACCOUNT_ID != '' &&
      vars.ECR_REPOSITORY != '' &&
      vars.APPLICATION_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-backend-release
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push release image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#backend-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid backend release tag: $RELEASE_TAG"; exit 1; }
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Immutable image $REGISTRY/$REPOSITORY:$RELEASE_TAG already exists; reusing it."
            exit 0
          fi
          docker build --build-arg APP_VERSION="$version" --tag "$REGISTRY/$REPOSITORY:$RELEASE_TAG" backend
          docker push "$REGISTRY/$REPOSITORY:$RELEASE_TAG"
      - name: Deploy release to EC2 through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.APPLICATION_INSTANCE_ID }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          RELEASE_TAG: ${{ github.ref_name }}
          AWS_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        run: |
          cat > ssm-command.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "install -d -m 0755 /opt/cpu-watcher",
              "if [ ! -d /opt/cpu-watcher/app/.git ]; then git clone --no-checkout https://github.com/${GITHUB_REPOSITORY}.git /opt/cpu-watcher/app; fi",
              "cd /opt/cpu-watcher/app",
              "git fetch --depth 1 origin refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}",
              "git checkout --detach ${RELEASE_TAG}",
              "AWS_REGION=${AWS_REGION} ECR_REGISTRY=${REGISTRY} ECR_REPOSITORY=${REPOSITORY} RELEASE_TAG=${RELEASE_TAG} PARAMETER_PREFIX=cpu-watcher-dev bash scripts/deploy-backend.sh"
            ]
          }
          EOF

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://ssm-command.json \
            --comment "Deploy $RELEASE_TAG" \
            --query 'Command.CommandId' \
            --output text)"

          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"
