services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine3.24}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpu_watcher}
      POSTGRES_USER: ${POSTGRES_USER:-cpu_watcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - database

  cpu-watcher:
    image: ${ECR_REGISTRY:?ECR_REGISTRY must be set}/${ECR_REPOSITORY:?ECR_REPOSITORY must be set}:${RELEASE_TAG:?RELEASE_TAG must be set}
    restart: unless-stopped
    environment:
      SPRING_APPLICATION_NAME: cpu-watcher
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:?COLLECTOR_API_KEY must be set}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cpu_watcher}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cpu_watcher}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - database
      - application

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - cpu-watcher
    ports:
      - "80:80"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - application

  database-cleanup:
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine3.24}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-cpu_watcher}
      PGUSER: ${POSTGRES_USER:-cpu_watcher}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          psql -v ON_ERROR_STOP=1 -c "
            DELETE FROM process_metrics
            WHERE collected_at < NOW() - INTERVAL '10 minutes';
          "
          sleep 600
        done
    networks:
      - database

volumes:
  postgres-data:

networks:
  application:
    driver: bridge
  database:
    driver: bridge
    internal: true
