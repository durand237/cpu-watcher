name: Collector

on:
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/collector.yml"
  push:
    branches: [main]
    tags: ["collector-v*"]
    paths:
      - "collector/**"
      - ".github/workflows/collector.yml"

permissions:
  contents: read

concurrency:
  group: collector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build collector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Derive build version
        id: version
        shell: bash
        run: |
          version="0.0.1-SNAPSHOT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#collector-v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid collector release tag: $GITHUB_REF_NAME"; exit 1; }
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test
        working-directory: collector
        run: ./gradlew -PreleaseVersion="${{ steps.version.outputs.value }}" test --no-daemon
      - name: Build release JAR
        working-directory: collector
        run: ./gradlew -PreleaseVersion="${{ steps.version.outputs.value }}" bootJar --no-daemon
      - name: Upload collector JAR
        uses: actions/upload-artifact@v7
        with:
          name: collector-${{ github.sha }}
          path: collector/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
