name: Test AWS OIDC Connection

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Assumes AWS_DEPLOY_ROLE_ARN is the full ARN (e.g. arn:aws:iam::123456789012:role/... )
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }} 

      - name: Verify Authentication (Who Am I?)
        run: |
          aws sts get-caller-identity

      - name: Verify "No Permissions" (This should FAIL)
        run: |
          echo "Testing S3 access..."
          aws s3 ls || echo "Successfully blocked from listing S3 buckets!"
