spring.application.name=cpu-watcher-collector
spring.main.web-application-type=none
collector.backend-url=${COLLECTOR_BACKEND_URL:http://127.0.0.1:8080}
collector.api-key=${COLLECTOR_API_KEY:}
collector.interval-ms=${COLLECTOR_INTERVAL_MS:1000}
collector.initial-delay-ms=${COLLECTOR_INITIAL_DELAY_MS:5000}
collector.max-processes=${COLLECTOR_MAX_PROCESSES:0}
