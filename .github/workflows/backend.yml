name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "compose.yaml"
      - "nginx/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    tags: ["backend-v*"]
    paths:
      - "backend/**"
      - "compose.yaml"
      - "nginx/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test
        working-directory: backend
        run: ./gradlew test --no-daemon
      - name: Build application JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon
      - name: Verify Docker image build
        run: docker build --tag cpu-watcher:${{ github.sha }} backend

  publish-ecr:
    name: Publish immutable backend image
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/tags/backend-v') &&
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.AWS_DEFAULT_REGION != '' &&
      vars.AWS_ACCOUNT_ID != '' &&
      vars.ECR_REPOSITORY != ''
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-backend-release
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push release image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker build --tag "$REGISTRY/$REPOSITORY:$VERSION" backend
          docker push "$REGISTRY/$REPOSITORY:$VERSION"
