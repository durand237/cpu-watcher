services:
  frontend:
    networks:
      - cpu-watcher-public
    image: node:24.19.0-alpine3.24
    working_dir: /workspace
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/workspace
      - frontend-node-modules:/workspace/node_modules

  postgres:
    networks:
      - cpu-watcher-db-private
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine3.24}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cpu-watcher:
    networks:
      - cpu-watcher-host-access
      - cpu-watcher-private
      - cpu-watcher-db-private
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cpu-watcher:local
    restart: unless-stopped
    environment:
      SPRING_APPLICATION_NAME: cpu-watcher
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:?COLLECTOR_API_KEY must be set}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  nginx:
    networks:
      - cpu-watcher-public
      - cpu-watcher-private
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      - cpu-watcher
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  database-cleanup:
    networks:
      - cpu-watcher-db-private
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine3.24}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          psql -v ON_ERROR_STOP=1 -c "
            DELETE FROM process_metrics
            WHERE collected_at < NOW() - INTERVAL '10 minutes';
          "
          sleep 600
        done

volumes:
  frontend-node-modules:
  postgres-data:
networks:
  cpu-watcher-public:
    driver: bridge
  cpu-watcher-host-access:
    driver: bridge
  cpu-watcher-private:
    driver: bridge
    internal: true
  cpu-watcher-db-private:
    driver: bridge
    internal: true
