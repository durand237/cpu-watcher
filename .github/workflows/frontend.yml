name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    tags: ["frontend-v*"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deploy-s3:
    name: Deploy frontend release
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/tags/frontend-v') &&
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.AWS_DEFAULT_REGION != '' &&
      vars.AWS_ACCOUNT_ID != '' &&
      vars.FRONTEND_BUCKET_NAME != '' &&
      vars.CLOUDFRONT_DISTRIBUTION_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v7
        with:
          name: frontend-${{ github.sha }}
          path: dist
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-frontend-release
      - name: Publish static files and invalidate CloudFront
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET_NAME }}
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
